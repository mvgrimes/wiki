version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck

formatters:
  enable:
    - goimports
    - gofmt
    - golines
  settings:
    goimports:
      local-prefixes:
        - wiki
  exclusions:
    generated: lax
    paths:
      - tmp
      - web
      - _tmp
      - docs/ref/
      - third_party$
      - builtin$
      - examples$
